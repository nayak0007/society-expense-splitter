# Security scanning — SAD §16.2 ("security.yml: CodeQL · Snyk · gitleaks") and §13.
#
# Snyk is deliberately not used: it needs a token that does not exist in this
# repository, and a job that silently no-ops without a secret is a check people
# believe is protecting them. `pnpm audit` covers the same class of finding from
# the lockfile with no third-party account, and it is the gate implemented here.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # A dependency can be disclosed as vulnerable while nothing in this repository
    # changes, so a PR-only gate has a blind spot for the code already on main.
    - cron: "17 3 * * 1"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # CodeQL uploads its analysis through the security-events API.
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          # `javascript-typescript` covers both apps and the shared packages; there
          # is no Java, Go, Python or Ruby in this repository.
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # `high` rather than `moderate`: a moderate advisory in a build-time
      # dependency is not worth blocking every PR, and the fastest way to make an
      # audit gate useless is to let it fail for findings nobody will fix.
      - name: Audit
        run: pnpm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans history as well as the diff; without this it only sees
          # the merge commit.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
