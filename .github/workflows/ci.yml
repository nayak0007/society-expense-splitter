# Core pull-request pipeline — SAD §16.2, Roadmap T013.
#
# WHY EVERY JOB INSTALLS ITS OWN DEPENDENCIES rather than passing a `setup`
# artefact around: a `node_modules` artefact is hundreds of megabytes, is
# platform-coupled, and reintroduces the failure the lockfile exists to prevent —
# a later job running against a tree that is not the one CI validated. pnpm's
# content-addressed store plus `actions/setup-node`'s cache makes a repeat install
# a link operation of a few seconds, so the `setup` stage buys nothing here. The
# expensive thing being cached is Turbo's task cache, which IS shared (see below).
#
# WHAT IS DELIBERATELY NOT HERE YET: `bundle-size` (expo-atlas). It needs a
# baseline figure to compare against, and adding it as a no-op job would show
# green without testing anything. `test-integration` used to be in that list for
# the same reason; Roadmap T034 supplied the missing piece — the migration chain
# is self-sufficient on a stock Postgres (its own bootstrap shim) and the runner
# provides a container runtime — so it is a real job now (see `test-integration`).
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A force-push to a PR should cancel the run it superseded, not race it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Telemetry off so a CI failure is never a network failure.
  TURBO_TELEMETRY_DISABLED: "1"
  # Turbo colours and progress bars are noise in a log view with no TTY.
  TURBO_LOG_ORDER: grouped
  CI: "true"

jobs:
  # ── Static analysis ────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm typecheck

  lint:
    name: Lint, formatting and layer boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Per-workspace lint (each app owns its config).
      - run: pnpm lint

      # The root flat config, which is the only one that reaches `packages/*`
      # sources — the per-workspace runs above do not.
      - run: pnpm exec eslint .

      # SAD §16.2 puts dependency-cruiser in the lint job on purpose: a layering
      # violation is a lint finding that happens to need a resolved module graph.
      - run: pnpm lint:arch

      - name: Prettier
        run: pnpm format:check

  # ── Unit tests ─────────────────────────────────────────────────────────────
  test-unit:
    name: Unit tests with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read for the checkout, write only to post the coverage summary below — the
    # gate itself is Jest's exit code and needs no write access at all.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # SAD §16.2's `test-unit`: "jest --coverage, per-path thresholds
      # enforced". `turbo run test:coverage` runs each package's suite with
      # coverage on, and Jest fails the task when a `coverageThreshold` in that
      # package's config is missed, so this one command is both the test suite
      # and the gate. It REPLACES a plain `pnpm test` rather than running beside
      # it — same suites, and running them twice would double the job for no
      # extra signal.
      #
      # `@ses/api`'s task is the **unified** run: unit + integration + e2e, merged
      # from the raw Istanbul maps by Jest's native multi-project coverage
      # (apps/api/jest-coverage.config.cjs), because SAD §15.2's 80/70 row is a
      # statement about the package and no single suite sees more than half of
      # it. That means this job needs a container runtime for the integration
      # project — ubuntu-latest ships Docker, and the suite owns its containers
      # (no service container, no hosted Supabase). Without a runtime the task
      # fails loudly in the integration global setup instead of skipping
      # integration. The same command is the local authoritative gate, so CI and
      # a developer machine cannot disagree about the number.
      #
      # It is expected to FAIL today: the merged API number is 64.05 statements /
      # 47.6 branches / 62.57 functions / 63.94 lines against the 80/70 row, and
      # the number is deliberately not lowered. See docs/guides/TEST_COVERAGE.md
      # for the deficit, the gap math and what closes it.
      - name: Tests with per-path coverage thresholds (SAD §15.2)
        run: pnpm test:coverage

      # ── The property-based invariant suite (Roadmap T059, SAD §15.2) ────────
      # "Property-based tests (fast-check) are mandatory on the split engine ...
      # Run with 10,000 iterations in CI" (SAD §15.2). The coverage run above
      # already executes this file, so the step is deliberately redundant on a
      # healthy run — and deliberately kept as its own named signal, because
      # "all four invariants green across 10,000 cases per strategy" is the
      # single most important test in the product and its failure should read as
      # its own step, with fast-check's seed, path and shrunk counterexample in
      # the log rather than buried in an Istanbul summary.
      #
      # It fails the job, not warns: there is no `continue-on-error`. And it
      # cannot pass by finding nothing — `jest properties` selects only
      # `properties.test.ts`, and Jest exits non-zero when a pattern matches no
      # test file, so a rename that stranded the suite would go red here.
      #
      # `if: always()` for the same reason as the e2e step below: the coverage
      # gate can fail on the API's number, which must not hide this signal.
      # Nothing here needs Docker or a database — the split engine is pure and
      # depends only on `packages/domain`.
      - name: Split-engine property suite (fast-check · 10,000 cases per strategy/basis)
        if: always()
        run: pnpm --filter @ses/split-engine test:property

      # The API's e2e suite boots the real Nest application (no database — the
      # readiness probe is asserted in its degraded state) and needs no container
      # runtime. The unified run above already executes these 333 tests, so this
      # step is deliberately redundant on a healthy run — and deliberately kept:
      # it is the one API behaviour signal that survives a broken container
      # runtime, and it is the un-instrumented execution of the suite.
      #
      # `if: always()` ON PURPOSE: the coverage gate above fails on every PR
      # until the API's uncovered production code is closed, and a failing step
      # skips the ones after it — which would silently retire the e2e signal that
      # this repository actually relies on for API behaviour.
      - name: API e2e suite
        if: always()
        run: pnpm --filter @ses/api test:e2e

      # ── The coverage summary (Roadmap T014) ──────────────────────────────────
      # Informational, never a gate: the exit code above decides. `if: always()`
      # because a summary is most useful on the runs where a threshold was
      # missed — which is currently every run, so a green-only comment would
      # never appear.
      - name: Build the coverage summary
        if: always()
        env:
          COVERAGE_JOB_STATUS: ${{ job.status }}
        run: node scripts/ci/coverage-comment.mjs coverage-comment.md

      - name: Comment the coverage summary on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- coverage-report -->';
            if (!fs.existsSync('coverage-comment.md')) return;
            const body = fs.readFileSync('coverage-comment.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            // Sticky: update this PR's existing summary instead of appending a
            // new one on every push.
            const existing = (await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            )).find((comment) => comment.body && comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  # ── Integration (SAD §15.4, Roadmap T034) ─────────────────────────────────
  #
  # Real Postgres and real Redis, started by Testcontainers from inside the suite,
  # with the committed migration chain applied by the same runner `pnpm db:migrate`
  # uses. "No mocked database — a mocked database cannot catch a broken constraint,
  # and constraints are load-bearing here" (SAD §15.4) is the entire justification
  # for a job that is slower than the unit one.
  #
  # WHY THIS IS SAFE ON A SHARED RUNNER: the suite owns its containers' lifecycle
  # (start in the global setup, removed in its teardown) and never reads an ambient
  # `DATABASE_URL` — the connection strings come from the containers it just
  # started (see apps/api/test/integration/setup-env.ts). No hosted Supabase secret
  # is involved, so ordinary pull requests cannot be affected by, or affect, the
  # development project. That separation is deliberate: the hosted project remains
  # the platform-compatibility proof, and this remains the repeatable one.
  #
  # Since T014 the same suites also run inside `test-unit`'s unified API coverage
  # gate. This job is kept as the focused, faster signal: it fails in isolation
  # with the integration log alone, rather than as one project inside the coverage
  # run.
  test-integration:
    name: Integration tests · Postgres + Redis (Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # The runner image already has Docker; the suite fails loudly and by name if
      # it is missing rather than falling back to mocks.
      - name: Integration suite (containers owned by the suite)
        run: pnpm --filter @ses/api test:integration

  # ── Database (ADR-0008) ────────────────────────────────────────────────────
  # The first execution of the schema history by automation. Every job above
  # validates TypeScript; this one validates SQL — until it existed, the
  # committed migrations were design claims rather than verified facts.
  #
  # Uses the same mechanism as every other environment: the project runner.
  # A bootstrap shim (the `auth` schema, the Supabase roles) makes the history
  # self-sufficient on a stock Postgres image, applied by the runner itself as
  # the history's first migration — so CI runs the identical code path a
  # developer's `pnpm db:migrate` runs.
  test-db:
    name: Database · apply + verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ses
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ses"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ses
      DATABASE_URL: postgresql://authenticator:authenticator@127.0.0.1:5432/ses

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # 1. The runner applies the full history — bootstrap shim included.
      #    `dist/` is built by the db:migrate script itself.
      - name: Apply the schema history
        run: pnpm --filter @ses/api db:migrate

      # 2. CI gate: the database must now exactly match HEAD. Catches a file
      #    added but never applied, a ledger/name mismatch, anything that
      #    would otherwise only surface at deploy time.
      - name: Verify the database matches HEAD
        run: pnpm --filter @ses/api db:check

      # 3. Idempotence: re-running must be a no-op. The runner's ledger makes
      #    this trivially true; asserting it also closes a future regression
      #    where a migration stops being recorded correctly.
      - name: Re-apply is a no-op
        run: pnpm --filter @ses/api db:migrate

      # 4. The RLS canary — ADR-0007's identity bridge, finally observed by
      #    automation. The committed canary (scripts/db/rls-canary.sql) mints
      #    two users through the shim, makes one a member via the real
      #    society_create RPC, then asserts member-sees-one/stranger-sees-none
      #    through the SET ROLE + GUC preamble the UnitOfWork issues on every
      #    request. A wrong GUC name fails to a SILENTLY EMPTY result set, not
      #    an error — that silent failure mode is what this step exists to
      #    catch. Piped into the service container, where psql lives.
      - name: RLS canary (member sees own, stranger sees none)
        run: |
          CID=$(docker ps --filter "ancestor=postgres:18-alpine" --format '{{.ID}}' | head -1)
          docker exec -i "$CID" psql "postgresql://postgres:postgres@127.0.0.1:5432/ses" \
            -v ON_ERROR_STOP=1 -q < scripts/db/rls-canary.sql
          echo "RLS canary passed."

  # ── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # SAD §16.2: "nest build + expo export (verifies the bundle compiles)".
      # A typecheck does not prove Metro can bundle, and the API's rspack build
      # is the only thing that exercises the ESM/decorator-metadata path that
      # production actually runs.
      - run: pnpm build
