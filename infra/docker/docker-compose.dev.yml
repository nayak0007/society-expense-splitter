# Local development stack — Roadmap T007, SAD §4.5.
#
#   pnpm dev:infra          # Postgres, Redis, MinIO
#   pnpm dev:infra:down
#
# Then run the app processes on the host (`pnpm --filter @ses/api dev`,
# `pnpm --filter @ses/mobile dev`), which is the fast loop: `nest --watch` is
# instant, whereas a bind-mounted container rebuild is not.
#
# The API and worker images are defined here too, but under the `api` profile, so
# they are only built and started when asked for:
#
#   docker compose -f infra/docker/docker-compose.dev.yml --profile api up --build
#
# That profile exists to prove the Dockerfile builds on a real machine and to give
# an end-to-end environment that mirrors production. It is not the default because
# building a 91 MB deploy tree to edit a controller is a worse loop than running
# the process directly.
#
# WHY THESE EXACT IMAGES: the versions are pinned to what production runs. A local
# stack on a newer Postgres than staging tests a database nobody deploys to — and
# `citext`/`pg_trgm` behaviour and planner changes are exactly the sort of
# difference that surfaces as a passing test suite and a production incident.
name: ses-dev

services:
  # ───────────────────────────────────────────────────────────────────────────
  # Postgres — the system of record (SAD §1.1)
  # ───────────────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ses
      # Deterministic collation: a database initialised with the host's locale can
      # order `ORDER BY name` differently from staging, which silently changes
      # pagination output.
      POSTGRES_INITDB_ARGS: "--locale=C --encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs ONCE, when the data directory is empty. It creates the three
      # extensions, the Supabase-compatible roles, and the `auth` schema shim the
      # committed RLS policies call — without which every policy evaluates false
      # and the API sees an empty database. Delete the volume to re-run it.
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # `pg_isready` and not a real query: this gates dependency start-up, and a
      # check that fails during recovery would turn a slow start into a crash loop.
      test: ["CMD-SHELL", "pg_isready -U postgres -d ses"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ───────────────────────────────────────────────────────────────────────────
  # Redis — cache, BullMQ queues, rate limits (SAD §4.3)
  # ───────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Two settings, both load-bearing:
    #   appendonly  — BullMQ jobs must survive a restart; the default snapshotting
    #                 loses whatever was written since the last save, which for a
    #                 queue means silently dropped jobs.
    #   maxmemory   — LRU eviction on a dev box beats an OOM kill. Note this is
    #                 NOT production-safe for a queue, where eviction must be off;
    #                 enqueued jobs are not evictable state.
    command: >-
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ───────────────────────────────────────────────────────────────────────────
  # MinIO — local S3 for the storage adapter (SAD §14.2, ADR-0012)
  # ───────────────────────────────────────────────────────────────────────────
  #
  # Why MinIO and not Supabase Storage locally: the storage adapter interface is
  # S3-compatible by design, so local development exercises the same code path that
  # production uses against Supabase Storage — with zero egress cost and no network
  # round trip. ADR-0012 D1 measured the local store directly: a presigned PUT whose
  # signature pins the exact `ContentLength` is refused by this server in both
  # directions (403 larger, 403 smaller, 411 omitted) and leaves no partial object
  # behind, which is the local half of the size gate.
  #
  # ── REPLACEMENT DEBT (recorded deliberately, do not silently change) ────────
  #
  # The image below is a **legacy/archived build**, pinned by immutable tag.
  # Upstream no longer publishes anonymous server images: on 2026-10-07
  # `docker.io/minio/minio` and `docker.io/minio/mc` both answered
  # `{"message":"object not found"}`, `quay.io/minio/minio` denied anonymous pull
  # (401), and `dl.min.io` returned 410 Gone for the community server and client.
  # This tag was pulled and used to verify every mechanism in ADR-0012 against a
  # real local object store; the integration suite starts the same image, so it
  # cannot rot unnoticed.
  #
  # Debt: this registry path is a read-only archive and its long-term availability
  # is not guaranteed. Replacing it means either a maintained MinIO distribution
  # reappearing, or a documented deviation from the Roadmap's "MinIO used locally"
  # sentence in favour of another maintained S3-compatible server — a product
  # decision, not a swap to make quietly. Never use `:latest` for storage.
  #
  # LOCAL AND TEST ONLY — not a production recommendation. It is the store whose
  # behaviour ADR-0012 measured and the one the integration suite starts; which
  # S3-compatible server a VPS deployment runs is a separate deployment decision
  # and remains open. The adapter is provider-neutral (`s3` + endpoint/bucket/
  # credentials), so that decision does not change application code.
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ses_minio
      MINIO_ROOT_PASSWORD: ses_minio_local
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console — http://localhost:9001
    volumes:
      # The image's own data directory; mounting anything else would silently
      # discard every upload on the next `docker compose up`.
      - minio-data:/bitnami/minio/data

  # There is deliberately **no** `createbuckets` one-shot service any more. It used
  # to run `mc` from a second image, and that image no longer exists (see above).
  # The bucket is created by the API's own storage bootstrap instead — the AWS SDK
  # the storage adapter already depends on, with `STORAGE_AUTO_CREATE_BUCKET=true`
  # in local `.env` — so `docker compose up` still reaches a usable state without a
  # second service, a second image, or a shell loop waiting for a health endpoint.

  # ───────────────────────────────────────────────────────────────────────────
  # API — optional, behind the `api` profile
  # ───────────────────────────────────────────────────────────────────────────
  api:
    profiles: ["api"]
    build:
      # The repository root, because the image installs the whole workspace and
      # bundles the shared packages. `.dockerignore` keeps the context small.
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: api
    restart: unless-stopped
    env_file:
      # Real credentials and vendor keys. Never committed; `scripts/dev/setup.sh`
      # copies it from `.env.example` on first run.
      - ../../apps/api/.env
    environment:
      # Overrides the host-oriented values in `.env`, which point at localhost.
      # Inside the network the services are addressed by name.
      DATABASE_URL: postgresql://authenticator:authenticator@postgres:5432/ses
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ses
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ───────────────────────────────────────────────────────────────────────────
  # Worker — optional, behind the `api` profile
  # ───────────────────────────────────────────────────────────────────────────
  #
  # The same image with a different entrypoint (see `api.Dockerfile`). BullMQ
  # processors land in Phase 3; today this proves the second entrypoint builds and
  # starts, and gives scheduled jobs a home to be added to.
  worker:
    profiles: ["api"]
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
      target: worker
    restart: unless-stopped
    env_file:
      - ../../apps/api/.env
    environment:
      DATABASE_URL: postgresql://authenticator:authenticator@postgres:5432/ses
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ses
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
      # SAD §14.4: the worker's statement timeout is deliberately far above the
      # API's 10 s, because publishing a maintenance cycle for 2,000 flats is
      # legitimately slow and must not be killed mid-transaction.
      DB_STATEMENT_TIMEOUT_MS: "120000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  minio-data:
