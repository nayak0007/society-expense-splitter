# Journey 1 — sign up with email and password (PRD §3.1, Roadmap T035).
#
# The Roadmap's declared filename is `01-signup-otp.yaml`. That name assumes an in-app OTP
# step, and the shipped auth has none: `register.tsx` calls Supabase's `signUp` with the
# emailed confirmation link, so the honest journey ends on "Confirm your email" (when
# confirmation is enabled) or on "Tell us your name" (when it is not). The file is therefore
# named for what it does, and the divergence is recorded in the Roadmap rather than papered
# over with a flow that would assert a screen the app does not have.
#
# Sign-up creates an account, so MAESTRO_EMAIL must be an address nothing has used yet —
# a `+run` suffix on a catch-all inbox is the intended form (see `docs/guides/MOBILE_E2E.md`,
# which also records why the email link itself cannot be followed here).
#
#   env: MAESTRO_NAME, MAESTRO_EMAIL, MAESTRO_PASSWORD
appId: com.resident360.app
name: Sign up with email and password
tags:
  - auth
---
# `clearState` wipes the app's data; `clearKeychain` (iOS) is what actually removes the
# session, which `expo-secure-store` keeps in the keychain and `clearState` does not touch. Plain
# `clearState: true` wipes the app's data directory, not the keychain, so on a simulator that has
# run before the app would restore a session and the welcome screen below would never appear.
- launchApp:
    clearState: true
    clearKeychain: true
# The cold-start bundle is why this waits rather than asserting immediately (see
# subflows/sign-in.yaml); the screen is the same one a user sees.
- extendedWaitUntil:
    visible: 'Transparent society finances — set up in 20 minutes.'
    timeout: 60000
- tapOn: 'Create an account'

- assertVisible: 'Create your account'
- tapOn: 'Full name'
- inputText: ${MAESTRO_NAME}
- tapOn: 'Email'
- inputText: ${MAESTRO_EMAIL}
# Anchored (`^…$`) because a password field renders a reveal toggle beside it whose
# accessibility label is "Show password" / "Show confirm password", and Maestro's text matching
# is a *contains* regex — an unanchored `Password` matches the toggle as well as the field.
- tapOn: '^Password$'
- inputText: ${MAESTRO_PASSWORD}
- tapOn: '^Confirm password$'
- inputText: ${MAESTRO_PASSWORD}
# The keyboard is still up after typing and covers the consent row, which sits below the two
# password fields — the first real run failed here with "Element not found" because the row was
# behind the keyboard, not because the selector was wrong. Back with the keyboard open dismisses
# it (it does not navigate); the field assertion proves we are still on the form.
- pressKey: Back
- assertVisible: 'Confirm password'
# The consent row is a Pressable with `accessibilityLabel="Accept the terms and privacy policy"`,
# which is the stable, short handle; its visible child text is the long sentence. Scroll to it
# rather than assuming it is above the fold on a phone-sized screen.
- scrollUntilVisible:
    element: 'Accept the terms and privacy policy'
    direction: DOWN
- tapOn: 'Accept the terms and privacy policy'
# Relative address for the same reason as the login submit: the screen's header is
# "Create account" and so is the button. The consent row is the anchor because it is the
# element immediately above the button once the keyboard is gone.
- tapOn:
    text: 'Create account'
    below: 'Accept the terms and privacy policy'

# The submit is a network call, so wait for the form to be replaced instead of asserting the
# next screen immediately. The consent row is the anchor because it is on screen when the
# button is tapped and exists only while the register form is mounted. Bounded: a 4xx (an
# invalid address, an exhausted mailer), a 5xx or a dead API leaves the row in place and fails
# here with a screenshot, rather than passing because both `when` blocks below were skipped.
- extendedWaitUntil:
    notVisible: 'Accept the terms and privacy policy'
    timeout: 30000

# Two honest endings, because whether Supabase requires confirmation is project
# configuration and not a property of the client. Either way the account exists and the
# client routed deliberately.
- runFlow:
    when:
      visible: 'Confirm your email'
    commands:
      - assertVisible: ${MAESTRO_EMAIL}
      - assertVisible: 'Resend verification email'
- runFlow:
    when:
      visible: 'Tell us your name'
    commands:
      - assertVisible: 'Your details'
