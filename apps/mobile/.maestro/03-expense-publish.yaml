# Journey 3 — draft an expense and publish it (Roadmap T077, PRD §3.4/§8.3).
#
# The journey a publish is about: sign in as an **Admin or Treasurer** (the two roles whose
# `expense.publish` cell is granted — PRD §2.1), record a bill through the real form, open the
# row it produced, confirm the publication, and read the summary the server measured.
#
# ## Why it is not written as "find a draft and publish it"
#
# Seeding a draft from outside the app would make the flow pass on an expense the form did
# not create, and the form is where the strategy, the selector and the amount meet. Creating
# the row here means a failure is attributable to the draft the flow just made, and it leaves
# no fixture for a later run to collide with.
#
# ## What the assertions are, and are not
#
# The summary line ("Published N shares totalling …") is rendered from the publication's own
# response, which is measured over the rows the API persisted — so its presence is a
# statement about the server, not about local state. The conservation of the split, the dues
# and the audit row are *not* assertable from the UI and are covered where they belong:
# `apps/api/test/integration/expenses.integration-spec.ts`.
#
# ## Test data
#
# The journey writes one **published** expense into the seeded staging society and cannot
# withdraw it (a published bill is voided, not deleted). `MAESTRO_TITLE` is suffixed with the
# run id by `scripts/ci/maestro.sh`, so every run is identifiable in the ledger and two runs
# never collide on a title; running the flow on a developer's device leaves the same kind of row
# in whatever society that account belongs to. Clean up by voiding the run's own expense — see
# `docs/guides/MOBILE_E2E.md` — never by deleting rows from a shared database.
#
#   env: MAESTRO_EMAIL, MAESTRO_PASSWORD, MAESTRO_AMOUNT, MAESTRO_TITLE, MAESTRO_CATEGORY
appId: com.resident360.app
name: Publish an expense
tags:
  - expenses
---
# `clearKeychain` as well as `clearState`: the session lives in the keychain (`expo-secure-store`),
# which `clearState` does not wipe.
- launchApp:
    clearState: true
    clearKeychain: true
- runFlow: subflows/sign-in.yaml

- tapOn: 'Expenses'
- assertVisible: 'Filter expenses'
# The form opens at its top: the amount is pinned, but the Save button sits below the fold on
# a phone-sized screen, so asserting it here would be asserting the viewport, not the form.
# `Category` is the section that proves the form opened *and* that the society's categories
# came back from the API — which is a precondition for the tap below.
- tapOn: 'New'
- assertVisible: 'Category'

# The amount is the sticky header, outside the scroll view, so it is reachable first.
- tapOn: 'Amount'
- inputText: ${MAESTRO_AMOUNT}
- tapOn: 'Title'
- inputText: ${MAESTRO_TITLE}
# The keyboard is still up after typing the title, and it covers the bottom of the form, so a
# scroll gesture from there is delivered to Gboard instead of to the form (measured: the scroll
# opened the keyboard's own settings sheet and found nothing; `hideKeyboard` is not supported
# for Gboard either). The form's `ScrollView` dismisses the keyboard on drag, so the first drag
# is aimed at the upper half — above the keyboard — and the rest of the journey runs on a
# keyboard-free screen. `Amount` is the sticky header: it is visible whether or not the drag
# moved the scroll content, which is what makes it the assertion that proves we are still on
# the form rather than a screen the drag navigated away from.
- swipe:
    start: '50%,45%'
    end: '50%,20%'
    duration: 400
- assertVisible: 'Amount'

# Categories are chips, addressed by name. The society's seeded nineteen are the vocabulary
# a treasurer already knows, so a flow naming one is naming something a user would tap.
#
# The chips wrap onto several rows *below the title*, and the seeded vocabulary is nineteen
# long — so a category near the end ("Sinking Fund" is seventeenth) is off-screen until the
# form is scrolled to it. This runs *after* the keyboard is dismissed, for the same reason the
# drag above is aimed high: a scroll gesture delivered to Gboard moves nothing, and a
# `scrollUntilVisible` that cannot scroll scrolls past nothing and reports the category missing.
# A flow that only worked for the first row of chips would be quietly testing the alphabet, not
# the form.
- scrollUntilVisible:
    element: '${MAESTRO_CATEGORY}'
    direction: DOWN
- tapOn: '${MAESTRO_CATEGORY}'

- scrollUntilVisible:
    element: 'Save expense'
    direction: DOWN
- tapOn: 'Save expense'

# The form replaces itself with the row it saved; the title the detail screen renders is the
# server's copy of what was typed, not the local form state.
#
# The wait is 60 s because the screen is not one request: it reads the expense, its splits,
# revisions, comments and attachments, and renders nothing until all five have landed. Each is
# milliseconds against a local API but seconds against a remote one over a phone's Wi-Fi —
# measured at 5–7 s per read on the seeded staging project (2026-10-19), which put the first
# render at ~13 s. The save that precedes it is not free either: `POST /v1/expenses` measured
# 10.0–10.3 s over three probes against the staging database, and one run took 89 s before the
# row committed (the device's connection stalled; the API logged the request as aborted).
# The budget therefore covers the save *and* the reads with headroom, and stayed bounded so a
# screen that never renders still fails rather than hanging the suite.
- extendedWaitUntil:
    visible: ${MAESTRO_TITLE}
    timeout: 60000
# A draft is publishable; the publish card sits below the split and bill sections.
- scrollUntilVisible:
    element:
      id: 'publish-expense'
    direction: DOWN
- tapOn:
    id: 'publish-expense'

# Native confirmation. Publishing writes a due per member and is irreversible, so the flow
# goes through the dialog exactly as a user must.
- assertVisible: 'Publish this expense?'
- tapOn: 'Publish'

# Publishing resolves the roster, writes a due per participant and reads the publication back:
# the slowest call in the journey (measured 18.7 s end-to-end against the staging project,
# 2026-10-19), so it gets a bounded wait with room for the reads that follow it.
- extendedWaitUntil:
    visible: 'Published .* shares totalling .*'
    timeout: 45000
