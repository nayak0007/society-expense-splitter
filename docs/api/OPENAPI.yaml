info:
  title: Resident 360 API
  description:
    "The Resident 360 API. Money is always integer paise in a `*Paise`
    field; timestamps are ISO-8601 UTC with milliseconds. Success responses are
    `{ data, meta }`; failures are `{ error: { code, message, requestId,
    timestamp, docs } }`."
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    supabase-jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas: {}
