                        responseTime: 3005
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *a5
                      redis: *a6
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
      summary: Readiness — Postgres, Redis and migration state
      tags: *a7
info:
  title: Society Expense Splitter API
  description: "The SES API. Money is always integer paise in a `*Paise` field;
    timestamps are ISO-8601 UTC with milliseconds. Success responses are `{
    data, meta }`; failures are `{ error: { code, message, requestId, timestamp,
    docs } }`."
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    supabase-jwt:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas: {}
