        "The caller's own membership role and the actions it currently
        holds, with their capabilities. A membership that is not active has an
        empty action list (`permissions: []`) — the role's grant is not what
        applies to a suspended or pending member — and a caller with no live
        membership at all is answered 404, the same as one outside the society."
