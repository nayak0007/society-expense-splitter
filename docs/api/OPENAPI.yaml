                        responseTime: 3005
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database: *a5
                      redis: *a6
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                          enum:
                            - up
                            - degraded
                            - down
                        responseTime:
                          type: number
                          description: Time the health indicator took to respond, in ms
                      additionalProperties: true
      summary: Readiness — Postgres, Redis and migration state
      tags: *a7
  /v1/societies:
    post:
      description: Creates the society, its settings and the creator's Admin
        membership in one transaction. The slug and join code are generated
        server-side.
      operationId: SocietiesController_create
      parameters: []
      responses:
        "201":
          description: The created society and the creator's membership.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      society:
                        type: object
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          slug:
                            type: string
                          type:
                            type: string
                            enum:
                              - apartment
                              - villa
                              - rowhouse
                              - shared_flat
                              - other
                          registrationNumber:
                            nullable: true
                            type: string
                          addressLine1:
                            nullable: true
                            type: string
                          addressLine2:
                            nullable: true
                            type: string
                          city:
                            type: string
                          state:
                            type: string
                          pincode:
                            nullable: true
                            type: string
                          country:
                            type: string
                            enum:
                              - IN
                          currency:
                            type: string
                            enum:
                              - INR
                          timezone:
                            type: string
                          joinCode:
                            type: string
                          joinCodeExpiresAt:
                            nullable: true
                            type: string
                          plan:
                            type: string
                            enum:
                              - free
                              - pro
                              - enterprise
                          createdBy:
                            type: string
                          createdAt:
                            type: string
                          updatedAt:
                            type: string
                          deletedAt:
                            nullable: true
                            type: string
                          settings:
                            type: object
                            properties:
                              billingDay:
                                type: integer
                              dueDay:
                                type: integer
                              graceDays:
                                type: integer
                              approvalThresholdPaise:
                                type: integer
                              billVacantFlats:
                                type: boolean
                              allowPartialPayments:
                                type: boolean
                              defaulterListPublic:
                                type: boolean
                              financialYearStartMonth:
                                type: integer
                              timezone:
                                type: string
                              currency:
                                type: string
                                enum:
                                  - INR
                            required:
                              - billingDay
                              - dueDay
                              - graceDays
                              - approvalThresholdPaise
                              - billVacantFlats
                              - allowPartialPayments
                              - defaulterListPublic
                              - financialYearStartMonth
                              - timezone
                              - currency
                            additionalProperties: false
                          memberCount:
                            type: integer
                        required:
                          - id
                          - name
                          - slug
                          - type
                          - registrationNumber
                          - addressLine1
                          - addressLine2
                          - city
                          - state
                          - pincode
                          - country
                          - currency
                          - timezone
                          - joinCode
                          - joinCodeExpiresAt
                          - plan
                          - createdBy
                          - createdAt
                          - updatedAt
                          - deletedAt
                          - settings
                          - memberCount
                        additionalProperties: false
                      membership:
                        type: object
                        properties:
                          id:
                            type: string
                          societyId:
                            type: string
                          userId:
                            type: string
                          role:
                            type: string
                            enum:
                              - admin
                              - treasurer
                              - committee_member
                              - resident
                              - tenant
                              - guest
                          status:
                            type: string
                            enum:
                              - pending
                              - active
                              - removed
                          occupancyType:
                            type: string
                            enum:
                              - owner
                              - tenant
                              - family_member
                          joinedAt:
                            nullable: true
                            type: string
                        required:
                          - id
                          - societyId
                          - userId
                          - role
                          - status
                          - occupancyType
                          - joinedAt
                        additionalProperties: false
                    required:
                      - society
                      - membership
                    additionalProperties: false
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                      timestamp:
                        type: string
                        format: date-time
                    required:
                      - requestId
                      - timestamp
                    additionalProperties: false
                required:
                  - data
                  - meta
                additionalProperties: false
        "400": &a8
          description: Malformed payload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - UNAUTHENTICATED
                          - TOKEN_EXPIRED
                          - TOKEN_REUSED
                          - FORBIDDEN
                          - NOT_FOUND
                          - VALIDATION_ERROR
                          - CONFLICT
                          - VERSION_MISMATCH
                          - DUPLICATE_RESOURCE
                          - IDEMPOTENCY_KEY_REUSE
                          - RATE_LIMITED
                          - PLAN_LIMIT_EXCEEDED
                          - PAYMENT_FAILED
                          - PAYMENT_ALREADY_VERIFIED
                          - SIGNATURE_INVALID
                          - SPLIT_MISMATCH
                          - INVALID_TRANSITION
                          - UNSETTLED_DUES
                          - CYCLE_ALREADY_PUBLISHED
                          - SOCIETY_ADMIN_REQUIRED
                          - MEMBER_INACTIVE
                          - UPGRADE_REQUIRED
                          - DEPENDENCY_UNAVAILABLE
                          - INTERNAL
                      message:
                        type: string
                      field:
                        type: string
                      details:
                        type: array
                        items:
                          type: object
                          properties:
                            field:
                              type: string
                            code:
                              type: string
                            message:
                              type: string
                            received: {}
                            limit: {}
                            current: {}
                          required:
                            - field
                            - code
                            - message
                          additionalProperties: false
                      requestId:
                        type: string
                      timestamp:
                        type: string
                      docs:
                        type: string
                    required:
                      - code
                      - message
                      - requestId
                      - timestamp
                    additionalProperties: false
                required:
                  - error
                additionalProperties: false
