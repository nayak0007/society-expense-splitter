    get:
      description:
        One page of the directory of the society named in X-Society-Id,
        with the total the filters produced. Supports `role`, `status`,
        `occupancy`, `buildingId`, `apartmentId`, `q` (name, phone or flat
        number), `sort`, `limit` and `offset`. Removed members are excluded
        unless `status=removed` is asked for explicitly. Contact details appear
        only where the member has consented, or for the caller's own row, or for
        a member-manager (`contactVisible` says which).
