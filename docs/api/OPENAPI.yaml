  /v1/invitations/preview/{token}:
    get:
      description:
        Public, because the recipient may not have an account yet. Returns
        the society's name, the role, the flat and a **masked** recipient
        (`in***@example.com`) — enough to recognise your own invitation, not
        enough to harvest an address from a forwarded link. An unknown or
        malformed token answers 404 identically.
      operationId: InvitationsController_preview
      parameters:
        - *a67
        - name: token
          required: true
          in: path
          description: The token exactly as it appears in the invitation link.
          schema:
            type: string
      responses:
