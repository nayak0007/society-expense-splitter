    get:
      description: Every society the caller belongs to, with their own role and
        membership status — what the society switcher renders.
      operationId: SocietiesController_list
      parameters: []
      responses:
        "200":
          description: The caller's societies, newest membership first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
