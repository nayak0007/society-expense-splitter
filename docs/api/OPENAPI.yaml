  /v1/invitations/accept/{token}:
    post:
      description:
        "Sign in as the invited account and accept. Atomic and single-use:
        the invitation is locked, re-checked (live, unexpired, the right
        account), and the membership is created, linked or activated exactly
        once — at the invited role, on the invited flat. `linkedShadow` in the
        response says whether an occupant the Admin had already recorded was
        linked."
      operationId: InvitationsController_accept
      parameters:
        - *a67
        - name: token
          required: true
          in: path
          description: The token exactly as it appears in the invitation link.
          schema:
            type: string
      responses:
        "200":
          description: The membership that now exists.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      societyId:
                        type: string
                      memberId:
                        type: string
                      role:
                        type: string
                        enum:
                          - admin
                          - treasurer
                          - committee_member
                          - resident
                          - tenant
                          - guest
                      apartmentId:
                        nullable: true
                        type: string
                      linkedShadow:
                        type: boolean
                    required:
                      - societyId
                      - memberId
                      - role
                      - apartmentId
                      - linkedShadow
                    additionalProperties: false
                  meta:
                    type: object
                    properties:
                      requestId:
                        type: string
                      timestamp:
                        type: string
                        format: date-time
